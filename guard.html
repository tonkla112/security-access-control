<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ป้อมยาม · Security Access Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
  :root{--navy:#16243d;--deep:#0f1b30;--bg:#e8edf4;--panel:#fff;--line:#dfe6ef;--muted:#6b7686;--green:#1f9d57;--amber:#d88517;--red:#b3261e;--blue:#2f6fed}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--bg);color:var(--navy);font-family:'IBM Plex Sans Thai',sans-serif;-webkit-font-smoothing:antialiased;padding:14px}
  button,input,select{font:inherit}
  .phone{max-width:430px;margin:0 auto;background:#f7f9fc;border:10px solid var(--deep);border-radius:32px;overflow:hidden;box-shadow:0 28px 60px -26px rgba(15,27,48,.62)}
  header{background:var(--navy);color:#fff;padding:18px 18px 16px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-weight:700}
  h1{font-size:17px;line-height:1.15}.sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;color:rgba(255,255,255,.55);margin-top:2px}
  .clock{text-align:right;font-family:'IBM Plex Mono',monospace}.clock b{display:block;font-size:18px}.clock span{font-size:10.5px;color:rgba(255,255,255,.55)}
  main{padding:14px;display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 10px 28px -20px rgba(15,27,48,.4)}
  .step{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:12px}.step span{width:22px;height:22px;border-radius:7px;background:#edf3ff;color:var(--blue);display:grid;place-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:11px 0 6px}
  input,select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--navy);outline:none}
  input:focus,select:focus{border-color:var(--blue)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .scanRow{display:flex;gap:8px}.scanRow input{font-family:'IBM Plex Mono',monospace}.btn{border:none;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}
  .btn.dark{background:var(--navy);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.amber{background:var(--amber);color:#fff}.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
  .qr{display:grid;place-items:center;text-decoration:none;width:48px;border-radius:11px;background:#e5f7ee;color:var(--green);font-size:20px}
  .result{display:none;border-radius:14px;padding:13px;margin-top:12px;border:1.5px solid var(--line)}
  .result.ok{display:block;background:#eef9f2;border-color:#bfe8d0}.result.bad{display:block;background:#fff2f0;border-color:#f2c3bd}
  .rTitle{font-size:16px;font-weight:800}.rMeta{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}.badge{display:inline-flex;margin-top:8px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800}.badge.ok{background:#d8f2e3;color:#126b3d}.badge.bad{background:#f8d2cd;color:var(--red)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg button{border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:12px;padding:12px;font-weight:800}.seg button.active.in{border-color:var(--green);background:#eef9f2;color:#126b3d}.seg button.active.out{border-color:var(--amber);background:#fff4e5;color:#9a5b06}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo{min-height:76px;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;font-size:11.5px;color:var(--muted);padding:8px;overflow:hidden;background:#fbfcfe}.photo input{display:none}.photo img{width:100%;height:70px;object-fit:cover;border-radius:9px}
  .submit{width:100%;margin-top:4px;padding:15px;border:none;border-radius:14px;background:var(--green);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.submit:disabled{background:#aab2c0;cursor:not-allowed}
  .msg{display:none;border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700}.msg.ok{display:block;background:#eef9f2;color:#126b3d}.msg.err{display:block;background:#fff2f0;color:var(--red)}
  .foot{display:flex;justify-content:center;gap:12px;padding:4px 0 14px;font-size:12px;color:var(--muted)}.foot a{color:var(--blue);text-decoration:none;font-weight:700}
  @media(max-width:430px){body{padding:0}.phone{min-height:100vh;border:0;border-radius:0}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="top">
      <div class="brand"><div class="mark">AC</div><div><h1>ป้อมยาม · เข้า-ออก</h1><div class="sub">RFID / QR ACCESS</div></div></div>
      <div class="clock"><b id="timeNow">--:--</b><span id="dateNow">--/--/----</span></div>
    </div>
  </header>
  <main>
    <div class="msg" id="topMsg"></div>
    <section class="card">
      <div class="step"><span>1</span>ตรวจบัตรผู้รับเหมา</div>
      <div class="scanRow">
        <a class="qr" href="scan.html" title="สแกน QR">📷</a>
        <input id="cardInput" placeholder="CTR-0001 หรือสแกน QR">
        <button class="btn dark" onclick="checkCard()">ตรวจ</button>
      </div>
      <div class="result" id="resultBox">
        <div class="rTitle" id="rTitle"></div>
        <div class="rMeta" id="rMeta"></div>
        <span class="badge" id="rBadge"></span>
      </div>
    </section>
    <section class="card">
      <div class="step"><span>2</span>รายละเอียดเข้า-ออก</div>
      <label>ประเภท</label>
      <div class="seg"><button id="btnIn" class="active in" onclick="setType('in')">เข้า</button><button id="btnOut" onclick="setType('out')">ออก</button></div>
      <label>ทะเบียนรถ</label><input id="plate" placeholder="เช่น 2กก 1847">
      <div class="row"><div><label>จำนวนคน</label><input id="people" type="number" min="1" placeholder="1"></div><div><label>ประตู</label><select id="gate"><option value="1">ประตู 1</option><option value="2">ประตู 2</option><option value="3">ประตู 3</option><option value="4">ประตู 4</option></select></div></div>
      <label>ผู้ติดต่อ / แผนก</label><input id="contact" placeholder="ชื่อผู้ติดต่อ หรือแผนก">
      <label>รปภ. / จุดป้อม</label><input id="guard" placeholder="เช่น ป้อม 1" value="ป้อม 1">
      <label>รูปประกอบ (ไม่บังคับ)</label>
      <div class="photos">
        <label class="photo" id="pv_vehicle"><input type="file" accept="image/*" capture="environment" onchange="pickPhoto(event,'vehicle')"><span>รูปรถ</span></label>
        <label class="photo" id="pv_person"><input type="file" accept="image/*" capture="environment" onchange="pickPhoto(event,'person')"><span>รูปบุคคล</span></label>
        <label class="photo" id="pv_goods"><input type="file" accept="image/*" capture="environment" onchange="pickPhoto(event,'goods')"><span>รูปสิ่งของ</span></label>
      </div>
    </section>
    <button class="submit" id="submitBtn" onclick="submitLog()" disabled>บันทึกเข้า-ออก</button>
  </main>
  <div class="foot"><a href="index.html">หน้าหลัก</a><a href="dashboard.html">Dashboard</a><a href="settings.html">ตั้งค่า</a></div>
</div>
<script>
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbx34JVdFwPyUHF5HsLH3lqRtZ3ZsOQbPRYR5-5a8PiUA5zyV1IJWwn47OWweOuxqFd-LA/exec';
const $=id=>document.getElementById(id);
let registry=[], current=null, accessType='in', photos={};
function hookUrl(){try{return localStorage.getItem('gs_webhook')||DEFAULT_URL}catch(e){return DEFAULT_URL}}
function token(){try{return localStorage.getItem('ac_access_token')||''}catch(e){return ''}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function msg(kind,text){const m=$('topMsg');m.className='msg '+kind;m.textContent=text}
function clearMsg(){const m=$('topMsg');m.className='msg';m.textContent=''}
function tick(){const d=new Date();$('timeNow').textContent=d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});$('dateNow').textContent=d.toLocaleDateString('th-TH')}
function isExpired(validTo){if(!validTo)return false;const p=String(validTo).split('/');const d=p.length===3?new Date(+p[2],+p[1]-1,+p[0]):new Date(validTo);d.setHours(23,59,59,999);return !isNaN(d)&&d<new Date()}
function setType(t){accessType=t;$('btnIn').className=t==='in'?'active in':'';$('btnOut').className=t==='out'?'active out':'';$('submitBtn').textContent=t==='in'?'บันทึกเข้า':'บันทึกออก'}
async function loadRegistry(){
  if(!token()){msg('err','ยังไม่ได้ตั้ง token: ไปหน้า Settings ก่อนใช้งานหน้าป้อมยาม');return}
  try{
    const r=await fetch(hookUrl()+'?action=list&t='+Date.now()+'&token='+encodeURIComponent(token()));
    const j=await r.json();
    if(j.status!=='ok')throw new Error(j.message||'โหลดทะเบียนไม่ได้');
    registry=j.contractors||[];
    clearMsg();
  }catch(e){msg('err','โหลดทะเบียนไม่สำเร็จ: '+e.message)}
}
function showContractor(c){
  current=c;
  const expired=isExpired(c.validTo);
  $('resultBox').className='result '+(expired?'bad':'ok');
  $('rTitle').textContent=c.name||c.cardNo;
  $('rMeta').innerHTML=esc(c.company||'-')+'<br>บัตร '+esc(c.cardNo)+' · หมดอายุ '+esc(c.validTo||'-')+'<br>ผู้ติดต่อ '+esc(c.contact||'-')+' · '+esc(c.dept||'-');
  $('rBadge').className='badge '+(expired?'bad':'ok');
  $('rBadge').textContent=expired?'หมดอายุ':'ใช้งานได้';
  $('submitBtn').disabled=expired;
}
function checkCard(){
  const code=$('cardInput').value.trim().toUpperCase();
  if(!code){$('cardInput').focus();return}
  const c=registry.find(x=>String(x.cardNo).toUpperCase()===code);
  if(!c){
    current=null;$('submitBtn').disabled=true;$('resultBox').className='result bad';$('rTitle').textContent='ไม่พบบัตรในระบบ';$('rMeta').textContent='ตรวจเลขบัตรอีกครั้ง หรือให้ HR ลงทะเบียนก่อน';$('rBadge').className='badge bad';$('rBadge').textContent='ปฏิเสธ';return;
  }
  showContractor(c);
}
const photoLabels={vehicle:'รูปรถ',person:'รูปบุคคล',goods:'รูปสิ่งของ'};
function renderPhotoSlot(key,src){
  const box=$('pv_'+key);
  box.innerHTML='';
  const input=document.createElement('input');
  input.type='file';
  input.accept='image/*';
  input.setAttribute('capture','environment');
  input.onchange=ev=>pickPhoto(ev,key);
  box.appendChild(input);
  if(src){
    const img=document.createElement('img');
    img.alt=photoLabels[key]||'รูป';
    img.src=src;
    box.appendChild(img);
  }else{
    const span=document.createElement('span');
    span.textContent=photoLabels[key]||'รูป';
    box.appendChild(span);
  }
}
function pickPhoto(ev,key){
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{photos[key]=rd.result;renderPhotoSlot(key,rd.result)};
  rd.readAsDataURL(f);
}
function resetForm(){
  current=null;photos={};$('cardInput').value='';$('plate').value='';$('people').value='';$('contact').value='';$('resultBox').className='result';$('submitBtn').disabled=true;
  ['vehicle','person','goods'].forEach(k=>renderPhotoSlot(k));
}
async function submitLog(){
  if(!current||!token())return;
  const payload={token:token(),company:current.company,name:current.name,cardNo:current.cardNo,type:accessType,plate:$('plate').value.trim(),people:$('people').value.trim()||'1',contact:$('contact').value.trim(),gate:$('gate').value,guard:$('guard').value.trim(),time:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}),savedAt:new Date().toISOString(),photos:photos};
  $('submitBtn').disabled=true;$('submitBtn').textContent='กำลังบันทึก...';
  try{
    await fetch(hookUrl(),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    msg('ok','ส่งบันทึกแล้ว: '+(accessType==='in'?'เข้า':'ออก')+' · '+current.cardNo);
    resetForm();
  }catch(e){msg('err','บันทึกไม่สำเร็จ: '+e.message);$('submitBtn').disabled=false}
  setType(accessType);
}
tick();setInterval(tick,1000);setType('in');loadRegistry();
try{const c=new URLSearchParams(location.search).get('card');if(c){$('cardInput').value=c;setTimeout(checkCard,900)}}catch(e){}
</script>
</body>
</html>
